<nav class="sidebar" aria-label="Site pages">
  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="section-nav">
    <span class="nav-toggle-label">Pages</span>
    <span class="nav-toggle-icon" aria-hidden="true"></span>
  </button>
  <ol class="section-nav" id="section-nav">
    {% for section in sections %}
      <li>
        <a href="{{ section.href }}"
           {% if current_page == section.slug or current_page == section.id %}class="is-active" aria-current="page"{% endif %}>{{ section.label }}</a>
      </li>
    {% endfor %}
  </ol>
</nav>
