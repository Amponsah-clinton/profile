{% extends "dashboard/base.html" %}

{% block content %}
<div class="form-card">
  <div class="form-card-header">
    <h2>{{ page.label }}</h2>
    <a href="{% if page.sort_order == 0 %}{% url 'site_home' %}{% else %}{% url 'site_page' page.slug %}{% endif %}" class="table-action" target="_blank">Preview</a>
  </div>
  <form method="post" class="dashboard-form">
    {% csrf_token %}
    {% for field in form %}
      <div class="form-group form-group-full">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        <p class="form-hint">Separate paragraphs with a blank line.</p>
      </div>
    {% endfor %}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Content</button>
    </div>
  </form>
</div>
{% endblock %}
