{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Profile Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'dashboard/dashboard.css' %}">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
      <h1>Academic</h1>
      <p>Sign in to manage your academic site</p>
    </div>

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-error">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post" class="login-form">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_username">Username or Email</label>
        {{ form.username }}
      </div>
      <div class="form-group">
        <label for="id_password">Password</label>
        <div class="password-field">
          {{ form.password }}
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
            <i class="fas fa-eye" id="passwordToggleIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
  </div>

  <script>
    (function () {
      var input = document.getElementById("id_password");
      var btn = document.getElementById("passwordToggle");
      var icon = document.getElementById("passwordToggleIcon");
      if (!input || !btn || !icon) return;
      btn.addEventListener("click", function () {
        var show = input.type === "password";
        input.type = show ? "text" : "password";
        icon.classList.toggle("fa-eye", !show);
        icon.classList.toggle("fa-eye-slash", show);
        btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
      });
    })();
  </script>
</body>
</html>
