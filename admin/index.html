<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ── Login screen ─────────────────────────────────── -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
        </svg>
      </div>
      <h1>Profile Admin</h1>
      <p class="login-sub">Sign in to manage your academic profile</p>
      <div id="login-error" class="login-error" style="display:none"></div>
      <form id="login-form" autocomplete="on">
        <div class="field-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" required autocomplete="email" placeholder="you@university.edu">
        </div>
        <div class="field-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" id="login-btn" class="btn-primary btn-full">Sign In</button>
      </form>
    </div>
  </div>

  <!-- ── Dashboard ────────────────────────────────────── -->
  <div id="dashboard" class="hidden">

    <!-- Top bar -->
    <header class="admin-topbar">
      <div class="topbar-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
        </svg>
        Profile Admin
      </div>
      <div class="topbar-actions">
        <span id="save-indicator" class="save-indicator" style="display:none">Saved</span>
        <a href="../" target="_blank" class="btn-ghost">View Site ↗</a>
        <button id="logout-btn" class="btn-ghost">Sign Out</button>
      </div>
    </header>

    <div class="admin-shell">

      <!-- Sidebar nav -->
      <nav class="admin-nav" id="admin-nav">
        <div class="nav-group">
          <span class="nav-group-label">Profile</span>
          <button class="nav-item active" data-section="profile">Profile Info</button>
          <button class="nav-item" data-section="social">Social Links</button>
        </div>
        <div class="nav-group">
          <span class="nav-group-label">Navigation</span>
          <button class="nav-item" data-section="sections">Section Names</button>
        </div>
        <div class="nav-group">
          <span class="nav-group-label">Content</span>
          <button class="nav-item" data-section="biography">Biography</button>
          <button class="nav-item" data-section="news">News</button>
          <button class="nav-item" data-section="research">Research</button>
          <button class="nav-item" data-section="education">Education</button>
          <button class="nav-item" data-section="publications">Publications</button>
          <button class="nav-item" data-section="teaching">Teaching</button>
          <button class="nav-item" data-section="awards">Awards</button>
          <button class="nav-item" data-section="service">Service</button>
        </div>
        <div class="nav-group">
          <span class="nav-group-label">Pages</span>
          <button class="nav-item" data-section="pages">Custom Pages</button>
        </div>
      </nav>

      <!-- Editor area -->
      <main class="admin-main" id="admin-main">
        <p class="admin-loading">Loading…</p>
      </main>

    </div>
  </div>

  <!-- ── Modal ─────────────────────────────────────────── -->
  <div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button id="modal-close" class="modal-close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button id="modal-cancel" class="btn-ghost">Cancel</button>
        <button id="modal-save" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- ── Toast ─────────────────────────────────────────── -->
  <div id="toast" class="toast hidden"></div>

  <script src="../config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
